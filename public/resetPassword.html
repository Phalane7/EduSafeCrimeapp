
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Reset your EduSafe password</title>

  <style>
    body {
        font-family: -apple-system, Roboto, Arial, sans-serif;
        background: #02225D;
        color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
    }

    .card {
        max-width: 340px;
    }

    h1 {
        font-size: 20px;
        margin-bottom: 8px;
    }

    p {
        font-size: 14px;
        color: #DCE6F7;
    }

    a.button {
        display: inline-block;
        margin-top: 20px;
        background: #FFFFFF;
        color: #02225D;
        font-weight: bold;
        padding: 12px 28px;
        border-radius: 26px;
        text-decoration: none;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Opening EduSafe&hellip;</h1>

  <p>
    If the app doesn't open automatically,
    tap the button below.
  </p>

  <a
          class="button"
          id="openAppLink"
          href="#"
  >
    Open EduSafe
  </a>

</div>

<script>

  // Firebase adds the oobCode to the password reset link.
  var params =
      new URLSearchParams(window.location.search);

  var oobCode =
      params.get("oobCode");

  if (oobCode) {

      /*
       * Open the EduSafe Android application.
       *
       * IMPORTANT:
       * The package name here MUST match the Android app:
       *
       * com.example.edusafe
       */

      var intentUrl =
          "intent://resetPassword?oobCode="
          + encodeURIComponent(oobCode)
          + "#Intent;"
          + "scheme=edusafe;"
          + "package=com.example.edusafe;"
          + "S.browser_fallback_url="
          + encodeURIComponent(window.location.href)
          + ";end";

      document
          .getElementById("openAppLink")
          .href = intentUrl;

      // Try to open the app automatically.
      window.location.href = intentUrl;

  } else {

      document
          .querySelector(".card")
          .innerHTML =
              "<h1>This link is invalid</h1>"
              + "<p>Please request a new password reset "
              + "from the EduSafe app.</p>";
  }

</script>

</body>

</html>
